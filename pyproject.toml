[project]
name = "bayesian-cox"
version = "0.1.0"
description = "Bayesian survival models for explainable prediction of diseases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "h5py==3.16.0",
    "pymc==5.28.5",
    "arviz==0.23.4",
    "scikit-survival==0.28.0",
    "lifelines==0.30.3",
    "shap==0.51.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "torch==2.13.0",
    "pycox==0.3.0",
    "torchtuples==0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Entry points prepend the project root to sys.path before importing src.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
