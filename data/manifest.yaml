      source_records: 686
      eligibility_rule: "All supplied records; require positive time and a binary event indicator."
      analysis_records: 686
      events: 299
      exclusions: 0
      id_column: null
      id_note: "The distributed ARFF supplies no patient identifier."
      endpoint:
        name: "recurrence-free survival event"
