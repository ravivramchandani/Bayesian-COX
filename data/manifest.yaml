        url: "https://raw.githubusercontent.com/sebp/scikit-survival/3e887ed7307a60c08f3fafec8b00d57f7a2d4982/COPYING"
        sha256: "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903"
