schema_version: "1.0.0"
manifest_date: "2026-08-15"
hash_algorithm: "SHA-256"
rebuild_command: "python scripts/download_datasets.py"
feature_config: "config/datasets.yaml"
release_policy:
  software_license: "MIT (project code only)"
  patient_level_data: >-
    The public release defaults to source metadata, hashes, citations and
    retrieval scripts. Upstream data terms remain controlling; the project
    MIT licence does not relicense source or derived patient-level data.
  synthetic_fallback: false
scope_decision:
  fourth_core_dataset_required: false
  rationale: >-
    The repaired three-cohort core has 3,166 records and 1,658 events; within
    a six-month master's thesis, confirmatory inference, calibration,
    robustness and writing take priority over another heterogeneous refit.
  optional_transport_status: "permanently dropped before protocol freeze"
  optional_simulation_status: "permanently dropped before protocol freeze"
  scope_boundary: >-
    No fourth cohort, Rotterdam transport analysis or simulation is part of
    the frozen six-month study. These are future extensions, not missing core
    evidence.

datasets:
  gbsg2:
    role: "confirmatory core cohort"
    source:
      provider: "scikit-survival"
      repository: "https://github.com/sebp/scikit-survival"
      release: "v0.24.1"
