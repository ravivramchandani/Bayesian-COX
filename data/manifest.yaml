  metabric:
    role: "confirmatory core cohort"
    source:
      provider: "cBioPortal DataHub"
      study_id: "brca_metabric"
      repository: "https://github.com/cBioPortal/datahub"
      commit: "165bd77077b03038f9c2ee104959eb474770b2a9"
      retrieval_date: "2026-08-15"
      files:
        - name: "data_clinical_patient.txt"
          url: "https://media.githubusercontent.com/media/cBioPortal/datahub/165bd77077b03038f9c2ee104959eb474770b2a9/public/brca_metabric/data_clinical_patient.txt"
          sha256: "2a6bbadc6e4b2b07c0505559d438da959fc5c9aba55c7194abc394e2d6454995"
        - name: "data_clinical_sample.txt"
          url: "https://media.githubusercontent.com/media/cBioPortal/datahub/165bd77077b03038f9c2ee104959eb474770b2a9/public/brca_metabric/data_clinical_sample.txt"
          sha256: "9a2291e065e2a0a5337b4eaeb09836e70b1bc3e1ed17714a013b53515697e6dc"
      study_metadata:
        url: "https://raw.githubusercontent.com/cBioPortal/datahub/165bd77077b03038f9c2ee104959eb474770b2a9/public/brca_metabric/meta_study.txt"
        sha256: "e3520792252f2910c10cb9361f48a66beeaded678616173db9f455d9af1aa06b"
      license:
        identifier: "ODbL-1.0"
        url: "https://raw.githubusercontent.com/cBioPortal/datahub/165bd77077b03038f9c2ee104959eb474770b2a9/public/brca_metabric/LICENSE"
        sha256: "aa607179437132751f7c8fcd9f2b4ed97677ded9812ad97b99abd380ae77aec2"
        obligations: "Attribution, keep adapted databases open, and ODbL share-alike."
      citations:
        - type: "METABRIC discovery study"
          doi: "10.1038/nature10983"
          url: "https://doi.org/10.1038/nature10983"
        - type: "METABRIC sequencing study"
          doi: "10.1038/ncomms11479"
          url: "https://doi.org/10.1038/ncomms11479"
        - type: "cBioPortal study"
          url: "https://www.cbioportal.org/study/summary?id=brca_metabric"
    independent_local_crosscheck:
      file: "../proposal/Proposal/1Breast Cancer METABRIC.csv"
      sha256: "d6f1b79d73958f2692e7df734f9e6fde955ced8e8e76c3e5d96ed6a4041ea4a0"
      result: >-
        All 2,509 patient identifiers, OS statuses, missingness patterns and
        mapped clinical values matched the pinned DataHub files; OS months
        differed only by decimal rounding below 3.4e-8 months.
      required_for_rebuild: false
    derivation:
      script: "scripts/download_datasets.py"
      raw_file: "data/raw/metabric.csv"
      sha256: "731ea80ce0240cb6aa96ffb0f4a3bb379615202966c954512664bef02b29545c"
      transformation: >-
        One-to-one merge patient/sample tables by PATIENT_ID; map
        0:LIVING to event=0 and 1:DECEASED to event=1; require both OS fields
        and duration > 0; rename mapped clinical columns without changing values.
    cohort:
      source_patient_records: 2509
      source_sample_records: 2509
      complete_os_records: 1981
      eligibility_rule: "Complete OS_MONTHS and OS_STATUS, with OS_MONTHS > 0."
      exclusions_missing_os: 528
      exclusions_non_positive_time: 1
      analysis_records: 1980
      events: 1144
      id_column: "patient_id"
      unique_ids: 1980
      endpoint:
        name: "overall survival"
        time_column: "duration"
        event_column: "event"
        event_value: 1
        censored_value: 0
        time_unit: "months"
        time_origin: "initial diagnosis"
        source_evidence: >-
          The pinned patient-file metadata defines OS_MONTHS as overall
          survival in months since initial diagnosis.
    prediction_time: "diagnosis/pathology before surgery or adjuvant treatment"
    primary_feature_set: "primary_diagnosis_npi"
    primary_representation: >-
      NPI is used without its tumour-size, node-count and grade components;
      stage, surgery and treatment fields are excluded from the primary set.
    missingness:
      denominator: 1980
      columns:
        patient_id: {count: 0, proportion: 0.0}
        age_at_diagnosis: {count: 0, proportion: 0.0}
        type_of_breast_surgery: {count: 25, proportion: 0.0126262626}
        cellularity: {count: 64, proportion: 0.0323232323}
        chemotherapy: {count: 1, proportion: 0.0005050505}
        hormone_therapy: {count: 1, proportion: 0.0005050505}
        radio_therapy: {count: 1, proportion: 0.0005050505}
        tumor_size: {count: 25, proportion: 0.0126262626}
        tumor_stage: {count: 514, proportion: 0.2595959596}
        lymph_nodes_examined_positive: {count: 76, proportion: 0.0383838384}
        neoplasm_histologic_grade: {count: 87, proportion: 0.0439393939}
        nottingham_prognostic_index: {count: 1, proportion: 0.0005050505}
        er_status: {count: 0, proportion: 0.0}
        pr_status: {count: 1, proportion: 0.0005050505}
        her2_status: {count: 1, proportion: 0.0005050505}
        inferred_menopausal_state: {count: 1, proportion: 0.0005050505}
        pam50_+_claudin-low_subtype: {count: 1, proportion: 0.0005050505}
        duration: {count: 0, proportion: 0.0}
        event: {count: 0, proportion: 0.0}

