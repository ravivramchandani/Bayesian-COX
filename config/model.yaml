# Model hyperparameters. Script arguments override these when passed.

cox_ph:
  l2_reg: 0.0001

random_survival_forest:
  n_estimators: 300
  min_samples_split: 10
  min_samples_leaf: 15
  max_depth: null
  max_features: "sqrt"
  random_state: 42

deepsurv:
  hidden_dims: [64, 32]
  dropout: 0.2
  activation: "relu"
  batch_norm: true
  learning_rate: 0.001
  l2_reg: 0.001
  max_iter: 300

bayesian_cox:
  n_intervals: 6
  inference_method: "nuts"
  sampler:
    draws: 2000
    tune: 2000
    chains: 4
    cores: 1
    random_state: 42

  priors:
    normal:
      mu: 0.0
      sigma: 1.0
      target_accept: 0.95

    # Regularised horseshoe. tau0 sets the global scale; slab_df and
    # slab_scale bound the local scales and prevent the funnel that causes
    # divergent transitions.
    horseshoe:
      tau0: 0.1
      slab_df: 4.0
      slab_scale: 2.0
      target_accept: 0.99

    # Continuous relaxation of spike-and-slab. spike_sd and slab_sd are the
    # two mixture component widths; alpha and beta_conc parameterise the Beta
    # prior on the inclusion weight.
    spike_slab:
      spike_sd: 0.05
      slab_sd: 2.0
      alpha: 1.0
      beta_conc: 1.0
      target_accept: 0.95

  # Convergence thresholds. A fit is reported as converged only when all hold.
  convergence:
    r_hat_max: 1.01
    ess_bulk_min: 400
    divergence_rate_max: 0.005
