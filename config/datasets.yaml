# Dataset specifications.
#
# Column names match the real sources: scikit-survival for GBSG2 and WHAS500,
# and the METABRIC clinical export produced by scripts/download_datasets.py.

gbsg2:
  name: "GBSG2"
  raw_file: "data/raw/gbsg2.csv"
  duration_col: "time"
  event_col: "cens"
  categorical_features:
    - "horTh"
    - "menostat"
  ordinal_features:
    tgrade: ["I", "II", "III"]
  numeric_features:
    - "age"
    - "tsize"
    - "pnodes"
    - "progrec"
    - "estrec"

whas500:
  name: "WHAS500"
  raw_file: "data/raw/whas500.csv"
  duration_col: "lenfol"
  event_col: "fstat"
  categorical_features:
    - "gender"
    - "cvd"
    - "afb"
    - "sho"
    - "chf"
    - "av3"
    - "miord"
    - "mitype"
  ordinal_features: {}
  numeric_features:
    - "age"
    - "hr"
    - "sysbp"
    - "diasbp"
    - "bmi"
    - "los"

metabric:
  name: "METABRIC"
  raw_file: "data/raw/metabric.csv"
  duration_col: "duration"
  event_col: "event"
  categorical_features:
    - "type_of_breast_surgery"
    - "cellularity"
    - "chemotherapy"
    - "hormone_therapy"
    - "radio_therapy"
    - "er_status"
    - "pr_status"
    - "her2_status"
    - "inferred_menopausal_state"
    - "pam50_+_claudin-low_subtype"
  ordinal_features: {}
  numeric_features:
    - "age_at_diagnosis"
    - "tumor_size"
    - "tumor_stage"
    - "lymph_nodes_examined_positive"
    - "neoplasm_histologic_grade"
    - "nottingham_prognostic_index"
